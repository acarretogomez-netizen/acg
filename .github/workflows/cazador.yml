name: cazador

on:
  schedule:
    - cron: "20 13,14 * * 1-5"
    - cron: "10 19,20 * * 1-5"
  workflow_dispatch:
    inputs:
      command:
        description: "Qué hacer"
        type: choice
        options: [hunt, scan]
        default: scan

concurrency:
  group: cazador
  cancel-in-progress: false

jobs:
  cazador:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    defaults:
      run:
        working-directory: bot-5-huecos/pullback-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot-5-huecos/pullback-bot/requirements.txt
      - run: pip install -r requirements.txt
      - name: Cazar
        env:
          T212_API_KEY: ${{ secrets.T212_API_KEY }}
          T212_API_SECRET: ${{ secrets.T212_API_SECRET }}
          T212_ENV: ${{ vars.T212_ENV || 'live' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DRY_RUN: ${{ vars.DRY_RUN || '0' }}
        run: python cazador.py "${{ github.event.inputs.command || 'hunt' }}"
